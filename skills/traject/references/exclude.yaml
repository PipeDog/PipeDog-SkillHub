# Traject 排除配置
# 初始化时会被复制到项目的 .traject/exclude.yaml
# 用户可根据项目情况增删

# 排除的目录（不生成 .traject.md）
exclude_dirs:
  - node_modules/
  - vendor/
  - __pycache__/
  - .git/
  - .idea/
  - .vscode/
  - .traject/          # 索引系统自身目录
  - dist/
  - build/
  - target/
  - .venv/
  - venv/
  - env/
  - .pytest_cache/
  - .mypy_cache/
  - .ruff_cache/
  - .turbo/
  - .next/
  - .nuxt/
  - .output/
  - coverage/
  - .codebuddy/
  - .cursor/
  - .windsurf/

# 排除的文件（不列入索引）
exclude_files:
  - package-lock.json
  - yarn.lock
  - pnpm-lock.yaml
  - go.sum
  - Cargo.lock
  - Gemfile.lock
  - poetry.lock
  - .DS_Store
  - "*.log"
  - "*.tmp"
  - "*.swp"
  - .env
  - .env.local
  - "*.env.*.local"
  - "*.min.js"
  - "*.min.css"
  - "*.map"

# 用户确认区域（初始化时填写）
# user_confirmed: true
# user_additions: []
# user_removals: []